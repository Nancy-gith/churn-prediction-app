services:
  - type: web
    name: churnguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: ALLOWED_ORIGINS
        sync: false # Set this manually after deploying frontend
    plan: free
